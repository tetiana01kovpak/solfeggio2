name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check web app
        run: node --check app.js && node scripts/check-frequencies.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SOLFEGGIO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SOLFEGGIO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SOLFEGGIO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SOLFEGGIO_KEYSTORE="$RUNNER_TEMP/release.jks"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Assemble site
        run: |
          mkdir site
          cp index.html app.js style.css site/
          cp android/app/build/outputs/apk/release/app-release.apk site/solfeggio.apk
          touch site/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          full_commit_message: Publish site
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
